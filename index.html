<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Steel Grating Design Check | MH Design</title>
<style>
:root{--bg:#E9EDF0;--panel:#fff;--ink:#17212B;--muted:#5B6874;--steel:#54748F;--bad:#B63A2E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141A20;--panel:#1C242C;--ink:#E6ECF1;--muted:#9AA7B3;--steel:#7FB0D3;--bad:#F08A7E}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);width:100%;max-width:380px;padding:32px 28px;border-radius:8px;border-top:4px solid var(--steel);box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.card img{height:84px;width:auto;margin-bottom:14px;background:#fff;border-radius:6px;padding:4px}
h1{font-size:21px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input{width:100%;padding:11px 12px;font:inherit;font-size:16px;border:1px solid #C9D1D8;border-radius:5px;background:transparent;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid #E8A800;outline-offset:1px}
button{margin-top:12px;width:100%;padding:11px;font:inherit;font-size:16px;font-weight:600;border:0;border-radius:5px;background:var(--steel);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--bad)}
.foot{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
